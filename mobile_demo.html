<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="keyboard.css">
<style>
  #editor {
    flex: 1; width: 100%; background: #faf7f2;
    padding: 16px 20px; font-size: 30px; line-height: 1.9;
    border: none; outline: none; overflow-y: auto;
    white-space: pre-wrap; color: #1a1208; overflow-wrap: break-word;
  }
</style>
</head>
<body>
<div id="phone-wrap">
<div id="action-bar">
  <span class="title">पाकाहारा</span>
  <button class="action-btn reset" onclick="resetAll()">↺ रीसेट</button>
</div>
<div id="editor"></div>
<div id="keyboard-wrap">
  <img id="kbd-image" src="images/keyboard.png" alt="keyboard" draggable="false" />
  <div id="kbd"></div>
  <div id="fav-overlay">
    <img id="fav-image" src="images/fav.png" alt="favorites" draggable="false" />
    <div id="fav-slots"></div>
  </div>
</div>
<div id="help-overlay">
  <div id="help-card">
    <div id="help-title">स्वाइप करके आसानी से मोड बदलें</div>
    <img src="images/help.png" alt="swipe zones guide" />
    <button id="help-close" onclick="hideHelp()">ठीक है</button>
  </div>
</div>
</div>

<script src="keyboard.js"></script>
<script>
// 상용구 편집 화면(fav_edit.html)으로 넘어갔다가 취소/저장 후 돌아오면, 페이지가
// 처음부터 다시 로드되므로 편집 직전에 쓰고 있던 문장과 자판 모드가 그냥 날아간다.
// 떠나기 직전 상태를 세션에 스냅샷으로 남겨뒀다가, 돌아왔을 때 그 스냅샷이 있으면
// (도움말을 다시 띄우는 등의) 첫 실행 절차 대신 그 상태를 그대로 복원한다.
const RESUME_KEY = 'pakahara_resume_state';

function onBeforeOpenFavoriteEditor() {
  const snapshot = {
    text: getText(),
    state,
    numericMode, lastNonNumericMode, numLastKey, numTapIdx, beforeShortform,
  };
  sessionStorage.setItem(RESUME_KEY, JSON.stringify(snapshot));
}

function restoreResumeState() {
  const raw = sessionStorage.getItem(RESUME_KEY);
  if (!raw) return false;
  sessionStorage.removeItem(RESUME_KEY);
  let snap;
  try { snap = JSON.parse(raw); } catch (e) { return false; }
  setText(snap.text || '');
  Object.assign(state, snap.state || {});
  numericMode = !!snap.numericMode;
  lastNonNumericMode = !!snap.lastNonNumericMode;
  numLastKey = snap.numLastKey || null;
  numTapIdx = snap.numTapIdx || 0;
  beforeShortform = snap.beforeShortform || null;
  updateKbdImage();
  render();
  return true;
}

if (!restoreResumeState()) {
  setText('');
  render();
  showHelp(); // 데모를 새로 열었을 때만 간편 모드 전환 안내를 보여준다
}
</script>
</body>
</html>
